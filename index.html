<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sachin | Life Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #0a0a0a;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Small green dot showing the system is live */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .live-clock {
            font-size: 0.9rem;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.1);
        }

        .stat-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .stat-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .progress-container {
            margin-top: 30px;
            text-align: left;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Sachin's Life Dashboard</h1> 
        
        <div class="status-container">
            <div class="status-dot"></div>
            <div class="live-clock" id="live-clock">Syncing...</div>
        </div>

        <div class="stat-box">
            <div class="stat-title">Current Exact Age</div>
            <div class="stat-value" id="age-display">0</div>
        </div>

        <div class="stat-box">
            <div class="stat-title">Est. Years Remaining</div>
            <div class="stat-value" id="remaining-display">0</div>
        </div>

        <div class="progress-container">
            <div class="progress-labels">
                <span>Born</span>
                <span>Life Progress</span>
                <span>Est. End</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        // Exact DOB: November 27, 1998 at 8:15 PM
        // Note: Months in JavaScript start at 0 (so 10 = November)
        const birthDate = new Date(1998, 10, 27, 20, 15, 0); 
        
        const expectedLifespanYears = 80;

        function updateDashboard() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString();

            const msSinceBirth = now - birthDate;
            const yearsSinceBirth = msSinceBirth / (1000 * 60 * 60 * 24 * 365.25);
            const yearsRemaining = expectedLifespanYears - yearsSinceBirth;

            document.getElementById('age-display').innerText = yearsSinceBirth.toFixed(12);
            document.getElementById('remaining-display').innerText = yearsRemaining.toFixed(12);

            const progressPercent = (yearsSinceBirth / expectedLifespanYears) * 100;
            document.getElementById('progress-fill').style.width = progressPercent + "%";
        }

        // Run immediately, then run every 50ms for the ticking effect
        updateDashboard();
        setInterval(updateDashboard, 50); 
    </script>
</body>
</html>
