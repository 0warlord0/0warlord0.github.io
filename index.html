<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sachin | Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --bg-main: #000000;
            --bg-card: #1c1c1e;
            --bg-card-hover: #2c2c2e;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent: #2997ff;
            --success: #30d158;
            --danger: #ff453a;
            --border: rgba(255, 255, 255, 0.08);
        }

        body.light-mode {
            --bg-main: #fbfbfd;
            --bg-card: #ffffff;
            --bg-card-hover: #f5f5f7;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #0071e3;
            --border: rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            transition: background-color 0.8s ease, color 0.8s ease;
            position: relative;
        }

        /* 3. Dynamic Focus Glow (Background) */
        .focus-glow {
            position: fixed;
            top: -20vh;
            left: -20vw;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(41, 151, 255, 0.08) 0%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
            animation: drift 20s ease-in-out infinite alternate;
            pointer-events: none;
        }

        body.light-mode .focus-glow {
            background: radial-gradient(circle, rgba(0, 113, 227, 0.08) 0%, transparent 70%);
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, 10vh) scale(1.2); }
        }

        /* Apple Blurred Header */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 100;
            border-bottom: 1px solid var(--border);
            transition: background 0.4s ease;
        }

        body.light-mode .header { background: rgba(251, 251, 253, 0.8); }

        .header-title {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 2. Glanceable Weather */
        .weather {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 4. Haptic Theme Toggle */
        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .theme-toggle:hover { transform: scale(1.1) rotate(180deg); }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 100px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.05;
            background: linear-gradient(180deg, var(--text-main) 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid var(--border);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s ease;
            opacity: 0;
            transform: translateY(40px);
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover {
            background: var(--bg-card-hover);
            transform: scale(1.01);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .mono-value {
            font-family: 'Space Mono', monospace;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn {
            background: rgba(128, 128, 128, 0.2);
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover { background: rgba(128, 128, 128, 0.3); }

        /* Progress Bars */
        .progress-wrapper { margin-top: 15px; }
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bg {
            width: 100%; height: 6px;
            background: rgba(128, 128, 128, 0.2);
            border-radius: 10px; overflow: hidden;
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: var(--text-main);
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .progress-fill.blue { background: var(--accent); }
        .progress-fill.green { background: var(--success); }

        /* Habit Tracker */
        .habit-box {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(128, 128, 128, 0.1); padding: 20px; border-radius: 16px; margin-top: 10px;
        }
        .streak-flame { font-size: 1.5rem; margin-right: 10px; }

        /* Bucket List Input */
        .input-row { display: flex; gap: 10px; margin-top: 10px; }
        .input-row input {
            flex: 1; min-width: 0;
            background: rgba(128, 128, 128, 0.1);
            border: 1px solid transparent;
            padding: 14px 20px;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 1rem; font-weight: 500;
            outline: none; transition: all 0.3s ease;
        }
        .input-row input:focus { border-color: var(--accent); background: transparent; }
        .input-row button {
            background: var(--text-main); color: var(--bg-main); 
            border: none; padding: 0 24px; border-radius: 16px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            flex-shrink: 0; transition: opacity 0.3s ease;
        }
        .input-row button:hover { opacity: 0.8; }

        /* Task List */
        #bucket-list { list-style: none; margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        #bucket-list li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(128, 128, 128, 0.05);
            border-radius: 16px; animation: slideUp 0.4s ease-out forwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #bucket-list li.completed span { text-decoration: line-through; color: var(--text-muted); }
        .task-actions button { background: none; border: none; cursor: pointer; font-size: 1.1rem; }
        .btn-complete { color: var(--success); }
        .btn-delete { color: var(--danger); }

        /* 5. Apple Watch Progress Ring Layout */
        .bucket-layout {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        @media (max-width: 500px) {
            .bucket-layout { flex-direction: column; text-align: center; }
        }

        .ring-container {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .ring-svg {
            transform: rotate(-90deg);
            width: 100px;
            height: 100px;
        }

        .ring-bg {
            fill: none;
            stroke: rgba(128, 128, 128, 0.2);
            stroke-width: 8;
        }

        .ring-fill {
            fill: none;
            stroke: var(--success);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 251.2; /* 2 * pi * r (r=40) */
            stroke-dashoffset: 251.2; /* Start empty */
            transition: stroke-dashoffset 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ring-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .bucket-info {
            flex: 1;
        }

        .bucket-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

    </style>
</head>
<body>

    <!-- 3. Dynamic Focus Glow -->
    <div class="focus-glow"></div>

    <div class="header">
        <div class="header-title">Sachin</div>
        <div class="header-right">
            <!-- 2. Glanceable Weather -->
            <div class="weather" id="weather">☀️ 28°</div>
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <div class="container">
        <div class="hero">
            <h1 id="greeting">Hello, Sachin.</h1>
            <p id="live-clock">Syncing...</p>
        </div>

        <div class="grid-2">
            <div class="card reveal">
                <div class="card-header">
                    <div class="card-title">Current Age</div>
                    <button class="btn" onclick="toggleAgeFormat()">Switch</button>
                </div>
                <div class="mono-value" id="age-display">0</div>
            </div>
            <div class="card reveal">
                <div class="card-header">
                    <div class="card-title">Years Remaining</div>
                </div>
                <div class="mono-value" id="remaining-display">0</div>
            </div>
        </div>

        <div class="card reveal">
            <div class="card-header">
                <div class="card-title">Next Birthday</div>
            </div>
            <div class="mono-value" id="birthday-countdown">Calculating...</div>
        </div>

        <div class="card reveal">
            <div class="progress-wrapper" style="margin-top: 0;">
                <div class="progress-labels">
                    <span>Life Progress</span>
                    <span id="life-percent">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill blue" id="life-progress-fill"></div>
                </div>
            </div>

            <div class="progress-wrapper" style="margin-top: 24px;">
                <div class="progress-labels">
                    <span>Today's Progress</span>
                    <span id="day-percent">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill green" id="day-progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="card reveal">
            <div class="card-header">
                <div class="card-title">Daily Habit Streak</div>
            </div>
            <div class="habit-box">
                <div>
                    <span class="streak-flame">🔥</span>
                    <strong id="streak-count">0</strong> Day Streak
                </div>
                <button class="btn" style="background: var(--success); color: #000; font-weight: 600;" onclick="logHabit()">Log Today</button>
            </div>
        </div>

        <!-- BUCKET LIST WITH APPLE WATCH RING -->
        <div class="card reveal">
            <div class="card-header">
                <div class="card-title">Bucket List</div>
            </div>
            
            <div class="bucket-layout">
                <div class="ring-container">
                    <svg class="ring-svg">
                        <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
                        <circle class="ring-fill" id="bucket-ring" cx="50" cy="50" r="40"></circle>
                    </svg>
                    <div class="ring-text" id="ring-text">0%</div>
                </div>
                <div class="bucket-info">
                    <p>Track your life goals and watch the ring close.</p>
                    <div class="input-row">
                        <input type="text" id="task-input" placeholder="Add a goal..." maxlength="40">
                        <button onclick="addTask()">Add</button>
                    </div>
                </div>
            </div>

            <ul id="bucket-list"></ul>
        </div>
        
    </div>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => { entry.target.classList.add('visible'); }, index * 100);
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

        const birthDate = new Date(1998, 10, 27, 20, 15, 0); 
        const expectedLifespanYears = 80;
        let showSeconds = false;

        function toggleAgeFormat() {
            showSeconds = !showSeconds;
            updateDashboard();
        }

        function updateDashboard() {
            const now = new Date();
            
            const hour = now.getHours();
            let greeting = "Hello, Sachin.";
            if (hour < 12) greeting = "Good Morning, Sachin.";
            else if (hour < 18) greeting = "Good Afternoon, Sachin.";
            else greeting = "Good Evening, Sachin.";
            document.getElementById('greeting').innerText = greeting;

            document.getElementById('live-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const msSinceBirth = now - birthDate;
            const yearsSinceBirth = msSinceBirth / (1000 * 60 * 60 * 24 * 365.25);
            const yearsRemaining = expectedLifespanYears - yearsSinceBirth;
            const secondsLived = Math.floor(msSinceBirth / 1000);

            if (showSeconds) {
                document.getElementById('age-display').innerText = secondsLived.toLocaleString();
            } else {
                document.getElementById('age-display').innerText = yearsSinceBirth.toFixed(8);
            }

            document.getElementById('remaining-display').innerText = yearsRemaining.toFixed(8);

            const lifePercent = (yearsSinceBirth / expectedLifespanYears) * 100;
            document.getElementById('life-progress-fill').style.width = lifePercent + "%";
            document.getElementById('life-percent').innerText = lifePercent.toFixed(2) + "%";

            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const endOfDay = new Date(startOfDay.getTime() + 24 * 60 * 60 * 1000);
            const dayPercent = ((now - startOfDay) / (endOfDay - startOfDay)) * 100;
            document.getElementById('day-progress-fill').style.width = dayPercent + "%";
            document.getElementById('day-percent').innerText = dayPercent.toFixed(2) + "%";

            let nextBirthday = new Date(now.getFullYear(), 10, 27, 20, 15, 0);
            if (now > nextBirthday) nextBirthday.setFullYear(now.getFullYear() + 1);
            const diff = nextBirthday - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / (1000 * 60)) % 60);
            const secs = Math.floor((diff / 1000) % 60);
            document.getElementById('birthday-countdown').innerText = `${days}d ${hours}h ${mins}m ${secs}s`;
        }

        // --- BUCKET LIST & APPLE WATCH RING ---
        const taskInput = document.getElementById('task-input');
        const bucketList = document.getElementById('bucket-list');
        const ringFill = document.getElementById('bucket-ring');
        const ringText = document.getElementById('ring-text');
        const ringCircumference = 251.2; // 2 * pi * 40

        let tasks = JSON.parse(localStorage.getItem('sachinTasks')) || [];

        function saveTasks() {
            localStorage.setItem('sachinTasks', JSON.stringify(tasks));
            renderTasks();
            updateRing();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;
            tasks.push({ id: Date.now(), text: text, completed: false });
            taskInput.value = '';
            saveTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
            saveTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
        }

        function renderTasks() {
            bucketList.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');
                li.innerHTML = `
                    <span style="font-weight: 500;">${task.text}</span>
                    <div class="task-actions">
                        <button class="btn-complete" onclick="toggleTask(${task.id})">✔</button>
                        <button class="btn-delete
