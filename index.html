<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sachin | Life Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #0a0a0a;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Load Animation */
        .dashboard {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-clock {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
            font-variant-numeric: tabular-nums;
            /* Smooth pulse animation for the clock */
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        /* Hover & Tap Animations for Boxes */
        .stat-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: default;
        }

        .stat-box:hover, .stat-box:active {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.1);
        }

        .stat-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f8fafc;
            font-variant-numeric: tabular-nums;
        }

        .progress-container {
            margin-top: 30px;
            text-align: left;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        /* Progress Bar Animation */
        .progress-bar-fill {
            height: 100%;
            width: 0%; /* Starts at 0 for the animation */
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); /* Smooth slide-in */
        }

        /* Glowing animation on the bar */
        .progress-bar-fill::after {
            content: '';
            display: block;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Sachin's Life Dashboard</h1>
        <div class="live-clock" id="live-clock">Loading time...</div>

        <div class="stat-box">
            <div class="stat-title">Current Exact Age</div>
            <div class="stat-value" id="age-display">Calculating...</div>
        </div>

        <div class="stat-box">
            <div class="stat-title">Est. Years Remaining</div>
            <div class="stat-value" id="remaining-display">Calculating...</div>
        </div>

        <div class="progress-container">
            <div class="progress-labels">
                <span>Born</span>
                <span>Life Progress</span>
                <span>Est. End</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        // Live Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Age Calculations & Animations
        function updateStats() {
            const exactAge = 27.912006945791216;
            const yearsLeft = 52.087993054208781;

            document.getElementById('age-display').innerText = exactAge.toFixed(4) + " years";
            document.getElementById('remaining-display').innerText = yearsLeft.toFixed(4) + " years";

            const totalLife = exactAge + yearsLeft;
            const progressPercent = (exactAge / totalLife) * 100;

            // Wait a tiny bit for the page to load, then trigger the progress bar animation
            setTimeout(() => {
                document.getElementById('progress-fill').style.width = progressPercent + "%";
            }, 300);
        }

        // Run stats when the page loads
        window.onload = updateStats;
    </script>
</body>
</html>
