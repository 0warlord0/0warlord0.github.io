<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sachin | Life Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        /* Dark Mode (Default) */
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --box-bg: rgba(0, 0, 0, 0.4);
            --box-border: rgba(255, 255, 255, 0.05);
            --accent: #38bdf8;
            --accent-2: #a855f7;
        }

        /* Light Mode */
        body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --box-bg: rgba(255, 255, 255, 0.9);
            --box-border: rgba(0, 0, 0, 0.05);
            --accent: #0284c7;
            --accent-2: #9333ea;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* Particle Canvas Background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none; /* Lets you click through it */
        }

        .dashboard {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: fadeIn 1s ease-out;
            transition: background 0.4s ease, border 0.4s ease;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .live-clock {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        /* Main Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            .stats-grid { grid-template-columns: 1fr; }
        }

        .stat-box {
            background: var(--box-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--box-border);
            transition: transform 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-3px);
        }

        .stat-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .stat-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Countdown Box */
        .countdown-box {
            background: var(--box-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--box-border);
            margin-bottom: 20px;
        }

        .countdown-timer {
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            color: var(--accent);
            margin-top: 5px;
        }

        /* Progress Bars */
        .progress-container {
            margin-bottom: 20px;
            text-align: left;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: var(--box-border);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* Bucket List Section */
        .bucket-list-section {
            background: var(--box-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--box-border);
            margin-top: 20px;
            text-align: left;
        }

        .bucket-list-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
            font-family: 'Outfit', sans-serif;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .input-group button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-group button:hover {
            background: var(--accent-2);
        }

        #bucket-list {
            list-style: none;
        }

        #bucket-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--box-border);
            animation: fadeIn 0.3s ease-out;
        }

        #bucket-list li.completed span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .task-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .task-actions button:hover {
            transform: scale(1.2);
        }

        .btn-complete { color: #22c55e; }
        .btn-delete { color: #ef4444; }

        /* Quote */
        .quote-box {
            font-style: italic;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 20px 0;
            padding: 0 10px;
        }

    </style>
</head>
<body>

    <!-- Floating Background -->
    <canvas id="particle-canvas"></canvas>

    <div class="dashboard">
        <div class="top-bar">
            <h1>Sachin's Dashboard</h1>
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
        </div>
        
        <div class="status-container">
            <div class="status-dot"></div>
            <div class="live-clock" id="live-clock">Syncing...</div>
        </div>

        <!-- Main Age Stats -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-title">Exact Age</div>
                <div class="stat-value" id="age-display">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Years Remaining</div>
                <div class="stat-value" id="remaining-display">0</div>
            </div>
        </div>

        <!-- Next Birthday Countdown -->
        <div class="countdown-box">
            <div class="stat-title">Countdown to Birthday (Nov 27)</div>
            <div class="countdown-timer" id="birthday-countdown">Calculating...</div>
        </div>

        <!-- Life Progress Bar -->
        <div class="progress-container">
            <div class="progress-labels">
                <span>Life Progress</span>
                <span id="life-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="life-progress-fill"></div>
            </div>
        </div>

        <!-- Today Progress Bar -->
        <div class="progress-container">
            <div class="progress-labels">
                <span>Today's Progress</span>
                <span id="day-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="day-progress-fill" style="background: linear-gradient(90deg, #22c55e, #eab308);"></div>
            </div>
        </div>

        <!-- Bucket List -->
        <div class="bucket-list-section">
            <div class="bucket-list-title">🎯 My Bucket List</div>
            <div class="input-group">
                <input type="text" id="task-input" placeholder="Add a new life goal..." maxlength="40">
                <button onclick="addTask()">Add</button>
            </div>
            <ul id="bucket-list">
                <!-- Tasks will appear here -->
            </ul>
        </div>

        <!-- Quote -->
        <div class="quote-box" id="daily-quote"></div>

    </div>

    <script>
        // --- 1. PARTICLE BACKGROUND LOGIC ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            const numberOfParticles = (canvas.width * canvas.height) / 15000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();


        // --- 2. DASHBOARD CALCULATIONS ---
        const birthDate = new Date(1998, 10, 27, 20, 15, 0); 
        const expectedLifespanYears = 80;

        function updateDashboard() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString();

            // Age & Remaining
            const msSinceBirth = now - birthDate;
            const yearsSinceBirth = msSinceBirth / (1000 * 60 * 60 * 24 * 365.25);
            const yearsRemaining = expectedLifespanYears - yearsSinceBirth;

            document.getElementById('age-display').innerText = yearsSinceBirth.toFixed(8);
            document.getElementById('remaining-display').innerText = yearsRemaining.toFixed(8);

            // Life Progress
            const lifePercent = (yearsSinceBirth / expectedLifespanYears) * 100;
            document.getElementById('life-progress-fill').style.width = lifePercent + "%";
            document.getElementById('life-percent').innerText = lifePercent.toFixed(2) + "%";

            // Day Progress
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const endOfDay = new Date(startOfDay.getTime() + 24 * 60 * 60 * 1000);
            const dayPercent = ((now - startOfDay) / (endOfDay - startOfDay)) * 100;
            document.getElementById('day-progress-fill').style.width = dayPercent + "%";
            document.getElementById('day-percent').innerText = dayPercent.toFixed(2) + "%";

            // Birthday Countdown
            let nextBirthday = new Date(now.getFullYear(), 10, 27, 20, 15, 0);
            if (now > nextBirthday) nextBirthday.setFullYear(now.getFullYear() + 1);
            const diff = nextBirthday - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / (1000 * 60)) % 60);
            const secs = Math.floor((diff / 1000) % 60);
            document.getElementById('birthday-countdown').innerText = `${days}d ${hours}h ${mins}m ${secs}s`;
        }

        // --- 3. DAILY QUOTE ---
        const quotes = [
            "Time is the most valuable thing a man can spend.",
            "The purpose of our lives is to be happy.",
            "Life is what happens when you're busy making other plans.",
            "Get busy living or get busy dying.",
            "You only live once, but if you do it right, once is enough."
        ];
        const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        document.getElementById('daily-quote').innerText = `"${quotes[dayOfYear % quotes.length]}"`;


        // --- 4. BUCKET LIST LOGIC (Local Storage) ---
        const taskInput = document.getElementById('task-input');
        const bucketList = document.getElementById('bucket-list');
        let tasks = JSON.parse(localStorage.getItem('sachinTasks')) || [];

        function saveTasks() {
            localStorage.setItem('sachinTasks', JSON.stringify(tasks));
            renderTasks();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;
            tasks.push({ id: Date.now(), text: text, completed: false });
            taskInput.value = '';
            saveTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) return { ...task, completed: !task.completed };
                return task;
            });
            saveTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
        }

        function renderTasks() {
            bucketList.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');

                li.innerHTML = `
                    <span>${task.text}</span>
                    <div class="task-actions">
                        <button class="btn-complete" onclick="toggleTask(${task.id})">✔</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">✖</button>
                    </div>
                `;
                bucketList.appendChild(li);
            });
        }

        // Allow pressing "Enter" to add a task
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        // Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('theme-btn');
            btn.innerText = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        }

        // Initialize
        renderTasks();
        updateDashboard();
        setInterval(updateDashboard, 1000); 
    </script>
</body>
</html>
