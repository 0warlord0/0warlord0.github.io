<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sachin | Dashboard</title>
    <style>
        /* Apple uses a font called SF Pro. We'll use Inter, which is the closest free alternative */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --bg-main: #000000;
            --bg-card: #1c1c1e;
            --bg-card-hover: #2c2c2e;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent: #2997ff;
            --accent-hover: #0077ed;
            --success: #30d158;
            --danger: #ff453a;
        }

        body.light-mode {
            --bg-main: #f5f5f7;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f2;
            --text-main: #1d1d1f;
            --text-muted: #515154;
            --accent: #0071e3;
            --accent-hover: #0077ed;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1), color 0.6s ease;
        }

        /* Floating Header */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.4s ease;
        }

        body.light-mode .header {
            background: rgba(245, 245, 247, 0.7);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .header-title {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: -0.01em;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 100px 24px 60px 24px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Apple-style typography */
        .hero-title {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.05;
            text-align: center;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        body.light-mode .hero-title {
            background: linear-gradient(135deg, #000 0%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 20px;
        }

        /* Cards with deep smooth shadows */
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease, box-shadow 0.4s ease;
            opacity: 0;
            transform: translateY(40px); /* For scroll animation */
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover {
            background: var(--bg-card-hover);
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .mono-value {
            font-family: 'Space Mono', monospace;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Grid Layout for stats */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        /* Progress Bars */
        .progress-wrapper {
            margin-top: 20px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        body.light-mode .progress-bg {
            background: rgba(0,0,0,0.1);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--text-main);
            border-radius: 4px;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .progress-fill.blue { background: var(--accent); }
        .progress-fill.green { background: var(--success); }

        /* Input Area */
        .input-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .input-row input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            padding: 16px 20px;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
        }

        body.light-mode .input-row input {
            background: rgba(0,0,0,0.05);
        }

        .input-row input:focus {
            border-color: var(--accent);
            background: transparent;
            box-shadow: 0 0 0 4px rgba(41, 151, 255, 0.1);
        }

        .input-row button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .input-row button:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .input-row button:active {
            transform: scale(0.95);
        }

        /* Task List */
        #bucket-list {
            list-style: none;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #bucket-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        body.light-mode #bucket-list li {
            background: rgba(0,0,0,0.03);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #bucket-list li:hover {
            background: rgba(255,255,255,0.08);
        }

        #bucket-list li.completed span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            transition: transform 0.2s ease;
        }

        .task-actions button:hover { transform: scale(1.2); }
        .btn-complete { color: var(--success); }
        .btn-delete { color: var(--danger); }

        .quote {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            font-weight: 400;
            margin-top: 20px;
            font-size: 1.1rem;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">Sachin's Dashboard</div>
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="container">
        <!-- Hero Section -->
        <div>
            <h1 class="hero-title">Your Life.<br>In Real Time.</h1>
            <p class="hero-subtitle" id="live-clock">Syncing...</p>
        </div>

        <!-- Age Stats -->
        <div class="grid-2">
            <div class="card reveal">
                <div class="card-title">Current Age</div>
                <div class="mono-value" id="age-display">0</div>
            </div>
            <div class="card reveal">
                <div class="card-title">Years Remaining</div>
                <div class="mono-value" id="remaining-display">0</div>
            </div>
        </div>

        <!-- Countdown -->
        <div class="card reveal">
            <div class="card-title">Next Birthday</div>
            <div class="mono-value" id="birthday-countdown" style="color: var(--accent);">Calculating...</div>
        </div>

        <!-- Progress Bars -->
        <div class="card reveal">
            <div class="progress-wrapper">
                <div class="progress-labels">
                    <span>Life Progress</span>
                    <span id="life-percent">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-bar-fill" id="life-progress-fill" class="progress-fill blue"></div>
                </div>
            </div>

            <div class="progress-wrapper" style="margin-top: 24px;">
                <div class="progress-labels">
                    <span>Today's Progress</span>
                    <span id="day-percent">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill green" id="day-progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Bucket List -->
        <div class="card reveal">
            <div class="card-title">Bucket List</div>
            <div class="input-row">
                <input type="text" id="task-input" placeholder="What do you want to achieve?" maxlength="40">
                <button onclick="addTask()">Add</button>
            </div>
            <ul id="bucket-list">
                <!-- Tasks appear here -->
            </ul>
        </div>

        <div class="quote reveal" id="daily-quote"></div>
    </div>

    <script>
        // --- 1. SCROLL ANIMATIONS (Apple Style) ---
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    // Add a slight delay to each card for a staggered effect
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, index * 100);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach((el) => {
            observer.observe(el);
        });


        // --- 2. DASHBOARD CALCULATIONS ---
        const birthDate = new Date(1998, 10, 27, 20, 15, 0); 
        const expectedLifespanYears = 80;

        function updateDashboard() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // Age & Remaining
            const msSinceBirth = now - birthDate;
            const yearsSinceBirth = msSinceBirth / (1000 * 60 * 60 * 24 * 365.25);
            const yearsRemaining = expectedLifespanYears - yearsSinceBirth;

            document.getElementById('age-display').innerText = yearsSinceBirth.toFixed(8);
            document.getElementById('remaining-display').innerText = yearsRemaining.toFixed(8);

            // Life Progress
            const lifePercent = (yearsSinceBirth / expectedLifespanYears) * 100;
            document.getElementById('life-progress-fill').style.width = lifePercent + "%";
            document.getElementById('life-percent').innerText = lifePercent.toFixed(2) + "%";

            // Day Progress
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const endOfDay = new Date(startOfDay.getTime() + 24 * 60 * 60 * 1000);
            const dayPercent = ((now - startOfDay) / (endOfDay - startOfDay)) * 100;
            document.getElementById('day-progress-fill').style.width = dayPercent + "%";
            document.getElementById('day-percent').innerText = dayPercent.toFixed(2) + "%";

            // Birthday Countdown
            let nextBirthday = new Date(now.getFullYear(), 10, 27, 20, 15, 0);
            if (now > nextBirthday) nextBirthday.setFullYear(now.getFullYear() + 1);
            const diff = nextBirthday - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / (1000 * 60)) % 60);
            const secs = Math.floor((diff / 1000) % 60);
            document.getElementById('birthday-countdown').innerText = `${days}d ${hours}h ${mins}m ${secs}s`;
        }

        // --- 3. DAILY QUOTE ---
        const quotes = [
            "The people who are crazy enough to think they can change the world are the ones who do.",
            "Your time is limited, so don't waste it living someone else's life.",
            "Design is not just what it looks like and feels like. Design is how it works.",
            "Simplicity is the ultimate sophistication.",
            "Innovation distinguishes between a leader and a follower."
        ];
        const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        document.getElementById('daily-quote').innerText = `"${quotes[dayOfYear % quotes.length]}"`;


        // --- 4. BUCKET LIST LOGIC ---
        const taskInput = document.getElementById('task-input');
        const bucketList = document.getElementById('bucket-list');
        let tasks = JSON.parse(localStorage.getItem('sachinTasks')) || [];

        function saveTasks() {
            localStorage.setItem('sachinTasks', JSON.stringify(tasks));
            renderTasks();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;
            tasks.push({ id: Date.now(), text: text, completed: false });
            taskInput.value = '';
            saveTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) return { ...task, completed: !task.completed };
                return task;
            });
            saveTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
        }

        function renderTasks() {
            bucketList.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');
                li.innerHTML = `
                    <span style="font-weight: 500;">${task.text}</span>
                    <div class="task-actions">
                        <button class="btn-complete" onclick="toggleTask(${task.id})">✔</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">✖</button>
                    </div>
                `;
                bucketList.appendChild(li);
            });
        }

        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('theme-btn');
            btn.innerText = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        }

        // Initialize
        renderTasks();
        updateDashboard();
        setInterval(updateDashboard, 1000); 
    </script>
</body>
</html>
